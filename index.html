<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tali Rimba: Duo Penjelajah</title>
  <meta name="description" content="Petualangan platformer kooperatif Irma dan Ubay menembus hutan, menghindari duri, dan bertahan sejauh mungkin bersama.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐒</text></svg>">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    body {
      background: #06110a;
      color: #e2f8e7;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      z-index: 20;
      background: rgba(10, 26, 16, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(82, 183, 136, 0.35);
      padding: 8px 14px;
      border-radius: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .ui-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    input {
      background: #040d07;
      border: 1px solid #2d6a4f;
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      width: 110px;
    }
    input:focus { border-color: #52b788; }
    button.btn {
      background: linear-gradient(135deg, #2d6a4f, #1b4332);
      border: 1px solid #52b788;
      color: #e2f8e7;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: all 0.15s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    button.btn:active {
      transform: scale(0.96);
      background: #52b788;
      color: #040d07;
    }
    #canvas-wrap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #040d07;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-p1 { background: #d4a373; color: #2b1810; box-shadow: 0 0 10px rgba(212,163,115,0.4); }
    .badge-p2 { background: #52b788; color: #041f10; box-shadow: 0 0 10px rgba(82,183,136,0.4); }

    /* On-Screen Mobile Controls */
    #mobile-controls {
      position: absolute;
      bottom: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 25;
      pointer-events: none;
    }
    .dpad, .action-pad {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }
    .touch-btn {
      width: 62px;
      height: 62px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      transition: transform 0.1s;
    }
    .touch-btn:active, .touch-btn.pressed {
      background: rgba(82, 183, 136, 0.45);
      border-color: #74c69d;
      transform: scale(0.92);
    }
    .btn-jump {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      background: rgba(45, 106, 79, 0.45);
      border-color: rgba(82, 183, 136, 0.6);
      font-size: 22px;
    }
  
    #ui {background:#15291fef;border-color:#a18b55;right:auto;max-width:calc(100% - 24px)}
    #camp {position:absolute;z-index:8;left:7vw;top:34%;padding:22px 32px;color:#fff5cc;background:linear-gradient(100deg,#142d22f2,#142d22cc);border-left:4px solid #ffc957;border-radius:0 18px 18px 0;box-shadow:0 10px 35px #09251955}
    #camp small {font-weight:800;color:#e4c383;letter-spacing:.21em}
    #camp h1 {font:italic 1000 clamp(42px,7vw,94px)/1 system-ui;letter-spacing:-.07em;color:#ffd267;text-shadow:0 4px #783715;margin:.12em 0}
    #camp p {font-size:14px;margin:10px 0 17px}
    #camp .theme-line {font-size:12px;text-transform:uppercase;letter-spacing:.11em;color:#ffe4a0;font-weight:800;margin:7px 0 4px}
    #camp button {color:#371f13;background:linear-gradient(#ffdf78,#ffad37);border:2px solid #fff1a9;border-radius:10px;padding:10px 19px;font-weight:800;cursor:pointer;box-shadow:0 3px #81491f}
    #camp[hidden]{display:none}
    @media(max-width:600px){#camp{left:5vw;right:5vw;top:30%;padding:19px}}
    #settings {position:absolute;z-index:22;top:12px;right:14px;width:46px;height:46px;border-radius:50%;border:2px solid #ffe0a0;background:linear-gradient(#ffca5b,#df841c);color:#432914;font: bold 26px system-ui;box-shadow:0 3px 0 #704722;cursor:pointer}
    #settings:focus-visible {outline:3px solid white}
    #ui {top:68px;left:auto;right:14px;width:min(350px,calc(100% - 28px));padding:16px}
    #ui[hidden]{display:none}
    </style>
</head>
<body>
  <button id="settings" title="Pengaturan" aria-label="Pengaturan" aria-controls="ui" aria-expanded="false">&#9881;</button>
  <div id="ui" hidden>
    <div class="ui-group">
      <span id="role-text">Status: <b>Menghubungkan...</b></span>
      <span id="room-info" style="display:none;cursor:pointer;" onclick="copyId()" title="Klik untuk salin ID">Room: <b id="my-id" style="text-decoration:underline;"></b></span>
      <button id="copy-btn" class="btn" style="display:none;" onclick="copyLink()">Salin Link</button>
      <button id="new-room-btn" class="btn" onclick="createNewRoom()">Buat Room Baru</button>
    </div>
    <div id="join-box" class="ui-group">
      <input id="join-input" placeholder="ID Teman..." />
      <button class="btn" onclick="joinRoom()">Gabung</button>
    </div>
  </div>

  <section id="camp"><small>PETUALANGAN KOOPERATIF • IRMA &amp; UBAY</small><h1>Tali Rimba</h1><p class="theme-line">Tema: hutan tropis, persahabatan, dan aksi platformer.</p><p>Lompat, ayunkan tali, dan hindari duri bersama. Bantu Irma si monyet dan Ubay si buaya menembus rimba sejauh mungkin tanpa terpisah.</p><button id="practice">Latihan sendiri</button></section>
  <div id="canvas-wrap">
    <canvas id="game"></canvas>
  </div>

  <div id="mobile-controls">
    <div class="dpad">
      <button class="touch-btn" id="btn-left">◀</button>
      <button class="touch-btn" id="btn-right">▶</button>
    </div>
    <div class="action-pad">
      <button class="touch-btn btn-jump" id="btn-jump">▲</button>
    </div>
  </div>

  <script>
    const settings = document.getElementById('settings');
    const panel = document.getElementById('ui');
    function showSettings(open) {
      panel.hidden = !open;
      settings.setAttribute('aria-expanded', String(open));
    }
    settings.onclick = () => showSettings(panel.hidden);
    document.addEventListener('pointerdown', e => {
      if (!panel.contains(e.target) && !settings.contains(e.target)) showSettings(false);
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !panel.hidden) {
        showSettings(false);
        settings.focus();
      }
    });
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    
    // WebRTC PeerJS with reliable Anthropic & Twilio public STUN servers
    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          { urls: 'stun:global.stun.twilio.com:3478' }
        ]
      }
    };
    let peer = null;
    let conn = null;
    let isHost = false;
    let myRole = null;
    let fullHostId = null;

    const ROPE_REST_LEN = 135;
    const ROPE_MAX_LEN = 250;
    const K_ROPE = 0.055;
    const ROPE_DAMPING = 0.92;

    const keys = { left: false, right: false, up: false };
    const remoteKeys = { left: false, right: false, up: false };

    const players = {
      monkey: { x: 140, y: 380, vx: 0, vy: 0, w: 38, h: 38, facing: 1, animFrame: 0, onGround: false },
      croc:   { x: 210, y: 390, vx: 0, vy: 0, w: 54, h: 30, facing: 1, animFrame: 0, onGround: false }
    };

    let cameraX = 0;
    let gameState = 'waiting';
    let tick = 0;
    let heartScore = 0;

    const art = {};
    for (const name of ['rimba', 'irma', 'ubay', 'motion']) {
      art[name] = new Image();
      art[name].src = 'assets/' + name + '.webp';
    }
    let practice = false;
    document.getElementById('practice').onclick = () => {
      practice = true;
      gameState = 'playing';
    };

    // Heart coins scattered along the jungle path
    const coinLayout = [
      { id: 1,  x: 320,  y: 360, collected: false },
      { id: 2,  x: 520,  y: 330, collected: false },
      { id: 3,  x: 700,  y: 340, collected: false },
      { id: 4,  x: 860,  y: 280, collected: false },
      { id: 5,  x: 1040, y: 260, collected: false },
      { id: 6,  x: 1160, y: 230, collected: false },
      { id: 7,  x: 1350, y: 240, collected: false },
      { id: 8,  x: 1650, y: 350, collected: false },
      { id: 9,  x: 1840, y: 290, collected: false },
      { id: 10, x: 2050, y: 260, collected: false },
      { id: 11, x: 2350, y: 220, collected: false },
      { id: 12, x: 2680, y: 340, collected: false }
    ];

    // Ambient floating fireflies / pollen
    const particles = Array.from({ length: 30 }, () => ({
      x: Math.random() * 3200,
      y: 100 + Math.random() * 380,
      size: 1 + Math.random() * 2.5,
      speedX: 0.15 + Math.random() * 0.35,
      phase: Math.random() * Math.PI * 2
    }));

    // Rich jungle platforms with foliage & vines
    const terrainLayout = [
      { x: 0,    y: 430, w: 480, h: 110, hasTree: true },
      { x: 560,  y: 410, w: 260, h: 130 },
      { x: 900,  y: 350, w: 220, h: 190, hasVines: true },
      { x: 1200, y: 310, w: 220, h: 230, hasTree: true },
      { x: 1500, y: 420, w: 300, h: 120 },
      { x: 1880, y: 360, w: 240, h: 180, hasVines: true },
      { x: 2200, y: 300, w: 260, h: 240, hasTree: true },
      { x: 2550, y: 410, w: 550, h: 130 }
    ];
    const sectorWidth = 3160;
    let sector = -1;
    let platforms = [], heartCoins = [];
    function loadSector(index) {
      if (index === sector) return;
      const oldCoins = new Map(heartCoins.map(c => [c.id, c.collected]));
      sector = index;
      platforms = [];
      heartCoins = [];
      for (let n = Math.max(0, index - 1); n <= index + 1; n++) {
        const offset = n * sectorWidth;
        terrainLayout.forEach((b, i) => {
          const x = offset + b.x;
          const spikes = (i + n) % 3 === 0 && b.w >= 240;
          platforms.push({ ...b, x, spike: spikes ? x + Math.floor(b.w * .70) : null });
        });
        coinLayout.forEach(c => {
          const id = n * coinLayout.length + c.id;
          heartCoins.push({ ...c, x: offset + c.x, id, collected: oldCoins.get(id) || false });
        });
      }
    }
    loadSector(0);
    let checkpoint = platforms[0];
    function resetPair() {
      [players.monkey, players.croc].forEach((p, i) => {
        Object.assign(p, { x: checkpoint.x + 42 + i * 62,
          y: checkpoint.y - p.h / 2, vx: 0, vy: 0, onGround: true });
      });
    }
    function checkHazards() {
      const pair = Object.values(players);
      for (const b of platforms) {
        if (b.spike !== null && pair.some(p =>
          Math.abs(p.x - b.spike - 13) < p.w * .32 + 11 &&
          p.y + p.h / 2 > b.y - 17 && p.y - p.h / 2 < b.y + 2)) {
          resetPair();
          return;
        }
        if (b.x > checkpoint.x && pair.every(p => p.x >= b.x + 22) &&
            pair.some(p => p.onGround && p.x < b.x + b.w)) checkpoint = b;
      }
      if (pair.some(p => p.y > 610 || p.x < platforms[0].x - 80)) resetPair();
    }

    function initPeer(customJoinId = null) {
      if (peer) {
        try { peer.destroy(); } catch (e) {}
      }

      document.getElementById('role-text').innerHTML = 'Status: <b>Menghubungkan ke server...</b>';
      if (typeof Peer === 'undefined') {
        document.getElementById('role-text').textContent = 'Offline · latihan tersedia';
        return;
      }
      peer = new Peer(peerConfig);

      peer.on('open', (id) => {
        fullHostId = id;
        const urlParams = new URLSearchParams(window.location.search);
        const joinId = customJoinId || urlParams.get('join');
        
        // Only connect as guest if joinId is provided and NOT equal to our own id
        if (joinId && joinId.trim() && joinId.trim() !== id) {
          document.getElementById('join-input').value = joinId;
          connectToHost(joinId.trim());
        } else {
          isHost = true;
          myRole = 'croc';
          document.getElementById('role-text').innerHTML = '<span class="badge badge-p2">🐊 Ubay (Host)</span>';
          document.getElementById('room-info').style.display = 'inline';
          document.getElementById('my-id').textContent = id;
          document.getElementById('copy-btn').style.display = 'inline';
          document.getElementById('join-box').style.display = 'none';
        }
      });

      peer.on('connection', (c) => {
        if (conn) {
          try { conn.close(); } catch(e){}
        }
        conn = c;
        setupConnection();
        conn.on('open', () => {
          gameState = 'playing';
          conn.send({ type: 'init', role: 'monkey' });
          document.getElementById('role-text').innerHTML = '<span class="badge badge-p2">🐊 Host (Ubay) - Terhubung!</span>';
        });
      });

      peer.on('error', (err) => {
        console.warn('Peer warning/error:', err.type, err);
        if (err.type === 'peer-unavailable') {
          document.getElementById('role-text').innerHTML = 
            '<span style="color:#ffb703;font-size:12px;">⚠️ Room teman tidak ditemukan / belum siap. Pastikan Host sudah buka linknya, atau buat room baru.</span>';
          document.getElementById('join-box').style.display = 'flex';
        } else if (err.type === 'unavailable-id') {
          createNewRoom();
        } else {
          document.getElementById('role-text').innerHTML = 
            `<span style="color:#ff6b6b;font-size:12px;">Koneksi: ${err.type}</span>`;
        }
      });
    }

    function createNewRoom() {
      // Clear URL params and reinit as fresh host
      window.history.replaceState({}, document.title, window.location.pathname);
      document.getElementById('join-input').value = '';
      initPeer();
    }

    function connectToHost(hostId) {
      isHost = false;
      myRole = 'monkey';
      document.getElementById('role-text').innerHTML = 'Status: <b>Menghubungkan ke teman...</b>';

      conn = peer.connect(hostId, { reliable: true });
      setupConnection();

      // Timeout check if peers can't traverse NAT
      const connectTimeout = setTimeout(() => {
        if (!conn || !conn.open) {
          document.getElementById('role-text').innerHTML = '<span style="color:#ffb703">Koneksi lambat/gagal. Coba buat room baru.</span>';
        }
      }, 9000);

      conn.on('open', () => {
        clearTimeout(connectTimeout);
        gameState = 'playing';
        document.getElementById('role-text').innerHTML = '<span class="badge badge-p1">🐒 Irma (Guest) - Terhubung!</span>';
        document.getElementById('join-box').style.display = 'none';
        document.getElementById('room-info').style.display = 'none';
        document.getElementById('copy-btn').style.display = 'none';
      });
    }

    function joinRoom() {
      const targetId = document.getElementById('join-input').value.trim();
      if (targetId) connectToHost(targetId);
    }

    function copyLink() {
      const url = `${window.location.origin}${window.location.pathname}?join=${fullHostId || peer.id}`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url);
        alert('Link Room disalin! Kirim ke temanmu.');
      } else {
        prompt('Salin link room ini:', url);
      }
    }

    function copyId() {
      const id = fullHostId || (peer ? peer.id : '');
      if (id) {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(id);
          alert('ID disalin: ' + id);
        } else {
          prompt('Salin ID ini:', id);
        }
      }
    }

    initPeer();

    function setupConnection() {
      if (practice) {
        for (const [p, x] of [[players.monkey, 140], [players.croc, 210]]) {
          Object.assign(p, { x, y: 380, vx: 0, vy: 0, onGround: false });
        }
        for (const coin of heartCoins) coin.collected = false;
        sector = -1;
        loadSector(0);
        checkpoint = platforms[0];
        heartScore = 0;
        gameState = 'waiting';
        practice = false;
      }
      conn.on('data', (data) => {
        if (data.type === 'init') {
          myRole = data.role;
          gameState = 'playing';
        } else if (data.type === 'input') {
          Object.assign(remoteKeys, data.keys);
        } else if (data.type === 'sync') {
          gameState = data.state || 'playing';
          loadSector(data.sector ?? 0);
          if (data.hearts !== undefined) {
            heartScore = data.hearts;
            if (data.collectedIds) {
              data.collectedIds.forEach(id => {
                const c = heartCoins.find(item => item.id === id);
                if (c) c.collected = true;
              });
            }
          }
          if (!isHost) {
            players.monkey.target = data.m;
            players.croc.target = data.c;
          }
        }
      });
      conn.on('close', () => {
        gameState = 'waiting';
        document.getElementById('role-text').innerHTML = '<span style="color:#ffb703;">Teman terputus. Menunggu kembali...</span>';
      });
    }

    function emitKey() {
      if (conn && conn.open) conn.send({ type: 'input', keys });
    }

    // Keyboard handlers
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft')  keys.left = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
      if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') keys.up = true;
      emitKey();
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyA' || e.code === 'ArrowLeft')  keys.left = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
      if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') keys.up = false;
      emitKey();
    });

    // Touch handlers
    function bindTouch(btnId, keyName) {
      const el = document.getElementById(btnId);
      const start = (e) => {
        e.preventDefault();
        keys[keyName] = true;
        el.classList.add('pressed');
        emitKey();
      };
      const end = (e) => {
        e.preventDefault();
        keys[keyName] = false;
        el.classList.remove('pressed');
        emitKey();
      };
      el.addEventListener('touchstart', start, { passive: false });
      el.addEventListener('touchend', end, { passive: false });
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', end);
      el.addEventListener('mouseleave', end);
    }

    bindTouch('btn-left', 'left');
    bindTouch('btn-right', 'right');
    bindTouch('btn-jump', 'up');

    function applyInput(p, input) {
      const isMonkey = p === players.monkey;
      // Smooth acceleration & gentle deceleration
      const accel = isMonkey ? 0.8 : 0.65;
      const maxSpd = isMonkey ? 5.2 : 4.4;

      if (input.left) {
        p.vx = Math.max(p.vx - accel, -maxSpd);
        p.facing = -1;
      }
      if (input.right) {
        p.vx = Math.min(p.vx + accel, maxSpd);
        p.facing = 1;
      }
      if (input.up && p.onGround) {
        p.vy = isMonkey ? -11.2 : -10.0;
        p.onGround = false;
      }
    }

    function updatePhysics(p) {
      p.vx *= 0.88; // Smooth inertia damping
      p.vy += 0.45; // Smooth realistic gravity
      p.x += p.vx;
      p.y += p.vy;

      if (Math.abs(p.vx) > 0.2) p.animFrame += 0.18;
      else p.animFrame = 0;

      p.onGround = false;
      for (const b of platforms) {
        if (p.x + p.w / 2 > b.x && p.x - p.w / 2 < b.x + b.w) {
          if (p.y + p.h / 2 >= b.y && p.y - p.h / 2 < b.y + 16 && p.vy >= 0) {
            p.y = b.y - p.h / 2;
            p.vy = 0;
            p.onGround = true;
          }
        }
      }


    }

    function updateRope() {
      const dx = players.croc.x - players.monkey.x;
      const dy = players.croc.y - players.monkey.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > ROPE_REST_LEN) {
        // Elastic spring with velocity damping for zero jitter
        const delta = dist - ROPE_REST_LEN;
        const force = delta * K_ROPE;
        const nx = dx / dist;
        const ny = dy / dist;

        players.monkey.vx = (players.monkey.vx + nx * force * 0.6) * ROPE_DAMPING;
        players.monkey.vy = (players.monkey.vy + ny * force * 0.6) * ROPE_DAMPING;
        players.croc.vx   = (players.croc.vx   - nx * force * 0.4) * ROPE_DAMPING;
        players.croc.vy   = (players.croc.vy   - ny * force * 0.4) * ROPE_DAMPING;

        // Soft position relaxation if pulled over max limit
        if (dist > ROPE_MAX_LEN) {
          const excess = (dist - ROPE_MAX_LEN) * 0.35;
          players.monkey.x += nx * excess * 0.6;
          players.monkey.y += ny * excess * 0.6;
          players.croc.x   -= nx * excess * 0.4;
          players.croc.y   -= ny * excess * 0.4;
        }
      }
    }

    function checkCoins() {
      for (const coin of heartCoins) {
        if (coin.collected) continue;
        const d1 = Math.hypot(players.monkey.x - coin.x, players.monkey.y - coin.y);
        const d2 = Math.hypot(players.croc.x - coin.x, players.croc.y - coin.y);
        if (d1 < 28 || d2 < 32) {
          coin.collected = true;
          heartScore += 1;
        }
      }
    }

    function step() {
      for (const p of Object.values(players)) {
        p.prevX = p.x;
        p.prevY = p.y;
        if (!practice && !isHost && p.target) {
          if (Math.hypot(p.target.x - p.x, p.target.y - p.y) > 150) {
            p.x = p.target.x;
            p.y = p.target.y;
          }
          p.vy = p.target.vy;
          p.onGround = p.target.ground;
          p.x += (p.target.x - p.x) * .38;
          p.y += (p.target.y - p.y) * .38;
          p.vx = p.target.vx;
          p.facing = p.target.f;
        }
      }
      tick++;

      if ((practice || isHost) && gameState === 'playing') {
        applyInput(players.croc, keys);
        applyInput(players.monkey, practice ? keys : remoteKeys);
        
        updatePhysics(players.monkey);
        updatePhysics(players.croc);
        updateRope();
        checkCoins();

        checkHazards();
        loadSector(Math.max(0, Math.floor((players.monkey.x + players.croc.x) / (2 * sectorWidth))));

        if (conn && conn.open && tick % 3 === 0) {
          conn.send({
            type: 'sync',
            m: { x: players.monkey.x, y: players.monkey.y, vx: players.monkey.vx, vy: players.monkey.vy, ground: players.monkey.onGround, f: players.monkey.facing },
            c: { x: players.croc.x, y: players.croc.y, vx: players.croc.vx, vy: players.croc.vy, ground: players.croc.onGround, f: players.croc.facing },
            sector, hearts: heartScore,
            collectedIds: heartCoins.filter(c => c.collected).map(c => c.id),
            state: gameState
          });
        }
      } else if (!isHost && gameState === 'playing') {
        if (conn && conn.open) {
          conn.send({ type: 'input', keys });
        }
      }

    }

    const frameMS = 1000 / 60;
    let previousTime;
    let remainder = 0;
    let renderTick = 0;
    function frame(now) {
      const elapsed = Math.min(now - (previousTime ?? now), 100);
      previousTime = now;
      remainder += elapsed;
      while (remainder >= frameMS) {
        step();
        remainder -= frameMS;
      }
      const alpha = remainder / frameMS;
      renderTick = tick + alpha;
      function pose(p) {
        const x = p.prevX ?? p.x, y = p.prevY ?? p.y;
        if (Math.hypot(p.x - x, p.y - y) > 75) return p;
        return { ...p, x: x + (p.x - x) * alpha, y: y + (p.y - y) * alpha };
      }
      const monkey = pose(players.monkey), croc = pose(players.croc);
      const scale = canvas.height / 540;
      const target = Math.max(0, (monkey.x + croc.x) / 2 - canvas.width / (2 * scale));
      cameraX += (target - cameraX) * (1 - Math.exp(-elapsed / 175));
      render(scale, monkey, croc);
      requestAnimationFrame(frame);
    }

    // --- ART & RENDERING ---
    function drawBackground(scale) {
      if (art.rimba.naturalWidth) {
        const img = art.rimba;
        const zoom = Math.max(canvas.width / img.width, canvas.height / img.height) * 1.12;
        const overflow = img.width * zoom - canvas.width;
        ctx.drawImage(img, -overflow * (.45 + .18 * Math.sin(cameraX / 1600)), (canvas.height - img.height * zoom) / 2, img.width * zoom, img.height * zoom);
        return;
      }
      // Atmospheric sky gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, '#04160c');
      skyGrad.addColorStop(0.5, '#0c2e1b');
      skyGrad.addColorStop(1, '#1b4332');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Distant Parallax Mist Mountains
      ctx.save();
      ctx.scale(scale, scale);
      ctx.translate(-Math.round(cameraX * 0.2), 0);
      ctx.fillStyle = 'rgba(20, 60, 40, 0.45)';
      ctx.beginPath();
      ctx.moveTo(-100, 360);
      for (let x = -100; x < 3500; x += 180) {
        ctx.quadraticCurveTo(x + 90, 180 + Math.sin(x * 0.02) * 50, x + 180, 360);
      }
      ctx.lineTo(3500, canvas.height / scale);
      ctx.lineTo(-100, canvas.height / scale);
      ctx.fill();

      // Mid-distance canopy silhouettes
      ctx.fillStyle = 'rgba(15, 48, 30, 0.65)';
      ctx.beginPath();
      for (let x = -50; x < 3500; x += 120) {
        ctx.arc(x, 340 + Math.sin(x) * 20, 65, Math.PI, 0);
      }
      ctx.fill();
      ctx.restore();

      // Ambient Jungle Fireflies
      ctx.save();
      for (const p of particles) {
        p.x += p.speedX;
        if (p.x > 3200) p.x = 0;
        const screenX = (p.x - cameraX * 0.5) * scale;
        if (screenX > -20 && screenX < canvas.width + 20) {
          const glow = Math.sin(tick * 0.05 + p.phase) * 0.4 + 0.6;
          ctx.fillStyle = `rgba(183, 228, 199, ${glow * 0.7})`;
          ctx.beginPath();
          ctx.arc(screenX, (p.y + Math.sin(tick * 0.03 + p.phase) * 12) * scale, p.size * scale, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    function drawRope(p1, p2) {
      const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      const sag = Math.max(0, (ROPE_REST_LEN - dist) * 0.4 + 14);
      const midX = (p1.x + p2.x) / 2;
      const midY = (p1.y + p2.y) / 2 + sag;

      // Dynamic rope tension color
      const isStretched = dist > ROPE_REST_LEN * 1.35;
      const ropeColor = isStretched ? '#ffb703' : '#e0a96d';

      ctx.save();
      // Rope shadow
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y + 4);
      ctx.quadraticCurveTo(midX, midY + 4, p2.x, p2.y + 4);
      ctx.stroke();

      // Main rope
      ctx.strokeStyle = ropeColor;
      ctx.lineWidth = isStretched ? 4 : 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.quadraticCurveTo(midX, midY, p2.x, p2.y);
      ctx.stroke();

      // Braided twine detail
      ctx.strokeStyle = '#7f4f24';
      ctx.lineWidth = 2.2;
      ctx.setLineDash([5, 6]);
      ctx.stroke();
      ctx.restore();
    }

    function drawHeart(x, y, size) {
      ctx.save();
      ctx.translate(x, y);

      // Floating bob & rotation
      const bob = Math.sin(tick * 0.08 + x) * 5;
      ctx.translate(0, bob);

      // Golden Heart Glow
      ctx.fillStyle = 'rgba(255, 75, 110, 0.3)';
      ctx.beginPath();
      ctx.arc(0, 0, size * 1.6, 0, Math.PI * 2);
      ctx.fill();

      // Shiny Gold Outer Coin
      ctx.fillStyle = '#ffb703';
      ctx.beginPath();
      ctx.arc(0, 0, size, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#fb8500';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Glowing Red Heart in center
      ctx.fillStyle = '#e63946';
      ctx.beginPath();
      const s = size * 0.55;
      ctx.moveTo(0, s * 0.7);
      ctx.bezierCurveTo(-s * 1.2, -s * 0.2, -s * 0.9, -s * 1.1, 0, -s * 0.4);
      ctx.bezierCurveTo(s * 0.9, -s * 1.1, s * 1.2, -s * 0.2, 0, s * 0.7);
      ctx.fill();

      // Heart shine highlight
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.beginPath();
      ctx.arc(-s * 0.35, -s * 0.45, s * 0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawMonkey(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.scale(p.facing, 1);

      const bob = Math.sin(p.animFrame) * 2;
      const legBob = Math.cos(p.animFrame) * 4;

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(0, p.h/2 + 2, 16, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Tail with dynamic curve
      ctx.strokeStyle = '#8b5a2b';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-10, 4);
      const tailWiggle = Math.sin(tick * 0.1) * 6;
      ctx.quadraticCurveTo(-26, -6 + tailWiggle, -20, -22 + tailWiggle);
      ctx.stroke();

      // Legs / Feet
      ctx.fillStyle = '#6f4518';
      ctx.beginPath();
      ctx.arc(-8, 14 + legBob, 4, 0, Math.PI * 2);
      ctx.arc(8, 14 - legBob, 4, 0, Math.PI * 2);
      ctx.fill();

      // Fur Body
      ctx.fillStyle = '#8b5a2b';
      ctx.beginPath();
      ctx.ellipse(0, 2 + bob, 16, 17, 0, 0, Math.PI * 2);
      ctx.fill();

      // Belly patch
      ctx.fillStyle = '#ddb892';
      ctx.beginPath();
      ctx.ellipse(3, 4 + bob, 9, 11, 0, 0, Math.PI * 2);
      ctx.fill();

      // Ears
      ctx.fillStyle = '#8b5a2b';
      ctx.beginPath();
      ctx.arc(-14, -8 + bob, 6.5, 0, Math.PI * 2);
      ctx.arc(14, -8 + bob, 6.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ddb892';
      ctx.beginPath();
      ctx.arc(-14, -8 + bob, 3.5, 0, Math.PI * 2);
      ctx.arc(14, -8 + bob, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // Head
      ctx.fillStyle = '#8b5a2b';
      ctx.beginPath();
      ctx.arc(0, -6 + bob, 15, 0, Math.PI * 2);
      ctx.fill();

      // Face Muzzle
      ctx.fillStyle = '#ddb892';
      ctx.beginPath();
      ctx.ellipse(3, -3 + bob, 11, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(4, -8 + bob, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(5, -8 + bob, 2.2, 0, Math.PI * 2);
      ctx.fill();

      // Nose & Smile
      ctx.fillStyle = '#5c3a21';
      ctx.beginPath();
      ctx.arc(7, -4 + bob, 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#5c3a21';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(5, -2 + bob, 3, 0.1, Math.PI * 0.8);
      ctx.stroke();

      // Badge Indicator
      ctx.scale(p.facing, 1);
      ctx.fillStyle = '#d4a373';
      ctx.font = 'bold 11px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('🐒 Irma', 0, -28 + bob);
      ctx.restore();
    }

    function drawCroc(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.scale(p.facing, 1);

      const legSwing = Math.sin(p.animFrame) * 5;

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(0, p.h/2 + 2, 28, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Tail with swim/walk waggle
      ctx.fillStyle = '#2d6a4f';
      ctx.beginPath();
      ctx.moveTo(-24, 0);
      const wag = Math.sin(tick * 0.15) * 5;
      ctx.quadraticCurveTo(-38, 2 + wag, -48, 6 + wag);
      ctx.lineTo(-24, 8);
      ctx.fill();

      // Feet with claws
      ctx.fillStyle = '#1b4332';
      ctx.beginPath();
      ctx.arc(-14 + legSwing, 14, 5, 0, Math.PI * 2);
      ctx.arc(14 - legSwing, 14, 5, 0, Math.PI * 2);
      ctx.fill();

      // Main Crocodile Body
      ctx.fillStyle = '#62812d';
      ctx.beginPath();
      ctx.roundRect(-26, -10, 52, 22, 10);
      ctx.fill();

      // Belly underplate
      ctx.fillStyle = '#95d5b2';
      ctx.beginPath();
      ctx.roundRect(-16, 4, 34, 7, 4);
      ctx.fill();

      // Spiky Scales Ridge
      ctx.fillStyle = '#1b4332';
      for (let i = -22; i <= 6; i += 7) {
        ctx.beginPath();
        ctx.moveTo(i, -10);
        ctx.lineTo(i + 3.5, -16);
        ctx.lineTo(i + 7, -10);
        ctx.fill();
      }

      // Long Snout & Jaw
      ctx.fillStyle = '#52b788';
      ctx.beginPath();
      ctx.roundRect(16, -6, 22, 16, [4, 8, 8, 4]);
      ctx.fill();

      // Sharp Teeth!
      ctx.fillStyle = '#fff';
      for (let tx = 22; tx <= 32; tx += 5) {
        ctx.beginPath();
        ctx.moveTo(tx, 2);
        ctx.lineTo(tx + 2, -2);
        ctx.lineTo(tx + 4, 2);
        ctx.fill();
      }

      // Nostril
      ctx.fillStyle = '#1b4332';
      ctx.beginPath();
      ctx.arc(33, -3, 1.5, 0, Math.PI * 2);
      ctx.fill();

      // Bulging Eye
      ctx.fillStyle = '#52b788';
      ctx.beginPath();
      ctx.arc(12, -9, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffb703';
      ctx.beginPath();
      ctx.arc(12, -9, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#081c15';
      ctx.beginPath();
      ctx.arc(13, -9, 2, 0, Math.PI * 2);
      ctx.fill();

      // Badge Indicator
      ctx.scale(p.facing, 1);
      ctx.fillStyle = '#d7e254';
      ctx.font = 'bold 11px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('🐊 Ubay', 0, -28);
      ctx.restore();
    }

    function drawHero(p, img, fallback) {
      if (!img.naturalWidth) return fallback(p);
      ctx.save();
      ctx.translate(p.x, p.y + p.h / 2);
      ctx.scale(p.facing, 1);
      if (art.motion.naturalWidth) {
        const running = Math.abs(p.vx) > .25;
        const airborne = gameState === 'playing' && !p.onGround;
        const phase = airborne ? (p.vy < 0 ? 4 : 5)
          : running ? ((Math.floor(p.x / 8) % 4 + 4) % 4) : 1;
        const row = img === art.irma ? 0 : 1;
        const bob = airborne || running ? 0 : Math.sin(renderTick * .055) * .7;
        ctx.drawImage(art.motion, phase * 192, row * 192, 192, 192, -34, -68 + bob, 68, 68 - bob);
      } else {
        ctx.drawImage(img, -32, -63, 64, 63);
      }
      ctx.restore();
    }

    function drawPlatform(b) {
      // Grass top foliage with lush gradient
      const grassGrad = ctx.createLinearGradient(0, b.y, 0, b.y + 14);
      grassGrad.addColorStop(0, '#d7e254');
      grassGrad.addColorStop(1, '#62812d');
      ctx.fillStyle = grassGrad;
      ctx.beginPath();
      ctx.roundRect(b.x, b.y, b.w, 14, [10, 10, 0, 0]);
      ctx.fill();

      // Rich Earth body with layered bedrock
      const dirtGrad = ctx.createLinearGradient(0, b.y + 14, 0, b.y + b.h);
      dirtGrad.addColorStop(0, '#72563a');
      dirtGrad.addColorStop(1, '#2c3228');
      ctx.fillStyle = dirtGrad;
      ctx.fillRect(b.x, b.y + 14, b.w, b.h - 14);

      for (let x = 0; x < b.w - 18; x += 23) {
        const drop = 8 + 9 * Math.abs(Math.sin(x + b.x));
        ctx.fillStyle = '#647e2e';
        ctx.beginPath();
        ctx.moveTo(b.x+x,b.y+10);
        ctx.lineTo(b.x+x+8,b.y+drop+7);
        ctx.lineTo(b.x+x+17,b.y+10);
        ctx.fill();
        ctx.strokeStyle = '#413b2d';
        ctx.beginPath();
        ctx.moveTo(b.x+x+15,b.y+20);
        ctx.lineTo(b.x+x+7,b.y+drop+25);
        ctx.lineTo(b.x+x+14,b.y+drop+42);
        ctx.stroke();
      }
      // Hanging foliage vines under platform
      if (b.hasVines) {
        ctx.strokeStyle = '#52b788';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        for (let vx = b.x + 30; vx < b.x + b.w - 20; vx += 45) {
          ctx.beginPath();
          ctx.moveTo(vx, b.y + 14);
          ctx.quadraticCurveTo(vx + 6, b.y + 40, vx - 4, b.y + 55);
          ctx.stroke();
        }
      }

      // Decorative Jungle Bush / Tree on top
      if (b.hasTree) {
        ctx.fillStyle = '#1b4332';
        ctx.fillRect(b.x + 20, b.y - 25, 8, 25);
        ctx.fillStyle = '#2d6a4f';
        ctx.beginPath();
        ctx.arc(b.x + 24, b.y - 32, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#52b788';
        ctx.beginPath();
        ctx.arc(b.x + 22, b.y - 35, 14, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function render(scale, monkey, croc) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawBackground(scale);

      ctx.save();
      ctx.scale(scale, scale);
      ctx.translate(-cameraX, 0);

      // Platforms
      for (const b of platforms) {
        if (b.x + b.w >= cameraX && b.x <= cameraX + canvas.width / scale) drawPlatform(b);
      }

      for (const b of platforms) {
        if (b.spike === null || b.spike < cameraX - 32 || b.spike > cameraX + canvas.width / scale) continue;
        for (let i = 0; i < 2; i++) {
          const x = b.spike + i * 13;
          ctx.fillStyle = '#c3cdba';
          ctx.strokeStyle = '#292f29';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(x, b.y);
          ctx.lineTo(x + 8, b.y - 22 + i * 4);
          ctx.lineTo(x + 14, b.y);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
      }

      // Draw Heart Coins
      for (const coin of heartCoins) {
        if (!coin.collected) {
          drawHeart(coin.x, coin.y, 14);
        }
      }

      // Dynamic Rope & Alive Characters
      drawRope(monkey, croc);
      drawHero(monkey, art.irma, drawMonkey);
      drawHero(croc, art.ubay, drawCroc);

      ctx.restore();

      // In-game HUD: Heart Score
      ctx.save();
      ctx.fillStyle = 'rgba(10, 26, 16, 0.8)';
      ctx.strokeStyle = '#52b788';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(14, 60, 95, 34, 12);
      ctx.fill();
      ctx.stroke();

      // Mini heart icon
      ctx.fillStyle = '#e63946';
      ctx.font = '16px system-ui';
      ctx.fillText('💖', 24, 83);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 15px system-ui';
      ctx.fillText(String(heartScore), 52, 83);
      ctx.restore();

      // Overlays
      document.getElementById('camp').hidden = gameState !== 'waiting';

    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
