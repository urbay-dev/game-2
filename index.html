<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tali Rimba: Monyet & Buaya</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    body {
      background: #0d1f12;
      color: #e2f8e7;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    #ui {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      z-index: 20;
      background: rgba(13, 31, 18, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid #285430;
      padding: 6px 12px;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .ui-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    input {
      background: #08150c;
      border: 1px solid #386641;
      color: #fff;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      width: 130px;
    }
    button.btn {
      background: #386641;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: background 0.15s;
    }
    button.btn:active { background: #6a994e; }
    #canvas-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08170e;
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 900 / 520;
      object-fit: contain;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-p1 { background: #d4a373; color: #3e2723; }
    .badge-p2 { background: #588157; color: #0d2818; }

    /* On-Screen Mobile Controls */
    #mobile-controls {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 25;
      pointer-events: none;
    }
    .dpad, .action-pad {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }
    .touch-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .touch-btn:active, .touch-btn.pressed {
      background: rgba(106, 153, 78, 0.65);
      border-color: #a7c957;
      transform: scale(0.93);
    }
    .btn-jump {
      width: 70px;
      height: 70px;
      background: rgba(88, 129, 87, 0.35);
      border-color: rgba(167, 201, 87, 0.5);
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div class="ui-group">
      <span id="role-text">Status: <b>Menghubungkan...</b></span>
      <span id="room-info" style="display:none;">Room: <b id="my-id"></b></span>
      <button id="copy-btn" class="btn" style="display:none;" onclick="copyLink()">Salin Link</button>
    </div>
    <div id="join-box" class="ui-group">
      <input id="join-input" placeholder="ID Teman..." />
      <button class="btn" onclick="joinRoom()">Gabung</button>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="game" width="900" height="520"></canvas>
  </div>

  <div id="mobile-controls">
    <div class="dpad">
      <button class="touch-btn" id="btn-left">◀</button>
      <button class="touch-btn" id="btn-right">▶</button>
    </div>
    <div class="action-pad">
      <button class="touch-btn btn-jump" id="btn-jump">▲</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    
    // ponytail: P2P manual id sync via PeerJS public cloud, upgrade to dedicated turn/signaling if high traffic
    const peer = new Peer();
    let conn = null;
    let isHost = false;
    let myRole = null;

    const ROPE_REST_LEN = 140;
    const ROPE_MAX_LEN = 260;
    const K_ROPE = 0.08;

    const keys = { left: false, right: false, up: false };
    const remoteKeys = { left: false, right: false, up: false };

    const players = {
      monkey: { x: 120, y: 380, vx: 0, vy: 0, w: 38, h: 38, onGround: false },
      croc:   { x: 180, y: 390, vx: 0, vy: 0, w: 52, h: 30, onGround: false }
    };

    let cameraX = 0;
    let gameState = 'waiting';

    const platforms = [
      { x: 0, y: 440, w: 500, h: 80 },
      { x: 580, y: 440, w: 260, h: 80 },
      { x: 920, y: 380, w: 220, h: 140 },
      { x: 1220, y: 340, w: 200, h: 180 },
      { x: 1500, y: 440, w: 320, h: 80 },
      { x: 1900, y: 380, w: 240, h: 140 },
      { x: 2220, y: 320, w: 260, h: 200 },
      { x: 2560, y: 420, w: 500, h: 100 }
    ];
    const GOAL_X = 2800;

    peer.on('open', (id) => {
      const urlParams = new URLSearchParams(window.location.search);
      const joinId = urlParams.get('join');
      
      if (joinId) {
        document.getElementById('join-input').value = joinId;
        connectToHost(joinId);
      } else {
        isHost = true;
        myRole = 'monkey';
        document.getElementById('role-text').innerHTML = '<span class="badge badge-p1">🐒 Monyet (Host)</span>';
        document.getElementById('room-info').style.display = 'inline';
        document.getElementById('my-id').textContent = id.slice(0, 6);
        document.getElementById('copy-btn').style.display = 'inline';
      }
    });

    peer.on('connection', (c) => {
      if (conn) { c.close(); return; }
      conn = c;
      setupConnection();
      conn.on('open', () => {
        conn.send({ type: 'init', role: 'croc' });
        gameState = 'playing';
      });
    });

    function connectToHost(hostId) {
      isHost = false;
      myRole = 'croc';
      conn = peer.connect(hostId);
      setupConnection();
      conn.on('open', () => {
        document.getElementById('role-text').innerHTML = '<span class="badge badge-p2">🐊 Buaya (Guest)</span>';
        document.getElementById('join-box').style.display = 'none';
      });
    }

    function joinRoom() {
      const targetId = document.getElementById('join-input').value.trim();
      if (targetId) connectToHost(targetId);
    }

    function copyLink() {
      const url = `${window.location.origin}${window.location.pathname}?join=${peer.id}`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url);
        alert('Link disalin! Kirim ke temanmu.');
      } else {
        prompt('Salin link ini:', url);
      }
    }

    function setupConnection() {
      conn.on('data', (data) => {
        if (data.type === 'init') {
          myRole = data.role;
          gameState = 'playing';
        } else if (data.type === 'input') {
          Object.assign(remoteKeys, data.keys);
        } else if (data.type === 'sync') {
          if (!isHost) {
            players.monkey.x = data.m.x;
            players.monkey.y = data.m.y;
            players.croc.x = data.c.x;
            players.croc.y = data.c.y;
            gameState = data.state;
          }
        }
      });
      conn.on('close', () => { gameState = 'waiting'; });
    }

    function emitKey() {
      if (conn && conn.open) conn.send({ type: 'input', keys });
    }

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyA' || e.code === 'ArrowLeft')  keys.left = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
      if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') keys.up = true;
      emitKey();
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyA' || e.code === 'ArrowLeft')  keys.left = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
      if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') keys.up = false;
      emitKey();
    });

    // Touch button handlers
    function bindTouch(btnId, keyName) {
      const el = document.getElementById(btnId);
      const start = (e) => {
        e.preventDefault();
        keys[keyName] = true;
        el.classList.add('pressed');
        emitKey();
      };
      const end = (e) => {
        e.preventDefault();
        keys[keyName] = false;
        el.classList.remove('pressed');
        emitKey();
      };
      el.addEventListener('touchstart', start, { passive: false });
      el.addEventListener('touchend', end, { passive: false });
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', end);
      el.addEventListener('mouseleave', end);
    }

    bindTouch('btn-left', 'left');
    bindTouch('btn-right', 'right');
    bindTouch('btn-jump', 'up');

    function applyInput(p, input) {
      const speed = p === players.monkey ? 0.9 : 0.65;
      const maxSpd = p === players.monkey ? 5.5 : 4.2;

      if (input.left)  p.vx = Math.max(p.vx - speed, -maxSpd);
      if (input.right) p.vx = Math.min(p.vx + speed, maxSpd);
      if (input.up && p.onGround) {
        p.vy = p === players.monkey ? -11.5 : -10;
        p.onGround = false;
      }
    }

    function updatePhysics(p) {
      p.vx *= 0.85;
      p.vy += 0.48;
      p.x += p.vx;
      p.y += p.vy;

      p.onGround = false;
      for (const b of platforms) {
        if (p.x + p.w / 2 > b.x && p.x - p.w / 2 < b.x + b.w) {
          if (p.y + p.h / 2 >= b.y && p.y - p.h / 2 < b.y + 16 && p.vy >= 0) {
            p.y = b.y - p.h / 2;
            p.vy = 0;
            p.onGround = true;
          }
        }
      }

      if (p.y > 600) {
        p.x = 120;
        p.y = 300;
        p.vx = 0;
        p.vy = 0;
      }
    }

    function updateRope() {
      const dx = players.croc.x - players.monkey.x;
      const dy = players.croc.y - players.monkey.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > ROPE_REST_LEN) {
        const force = (dist - ROPE_REST_LEN) * K_ROPE;
        const nx = dx / dist;
        const ny = dy / dist;

        players.monkey.vx += nx * force * 0.65;
        players.monkey.vy += ny * force * 0.65;
        players.croc.vx   -= nx * force * 0.35;
        players.croc.vy   -= ny * force * 0.35;

        if (dist > ROPE_MAX_LEN) {
          const excess = (dist - ROPE_MAX_LEN) / 2;
          players.monkey.x += nx * excess * 0.65;
          players.monkey.y += ny * excess * 0.65;
          players.croc.x   -= nx * excess * 0.35;
          players.croc.y   -= ny * excess * 0.35;
        }
      }
    }

    function step() {
      if (isHost && gameState === 'playing') {
        applyInput(players.monkey, keys);
        applyInput(players.croc, remoteKeys);
        
        updatePhysics(players.monkey);
        updatePhysics(players.croc);
        updateRope();

        if (players.monkey.x >= GOAL_X && players.croc.x >= GOAL_X) {
          gameState = 'win';
        }

        if (conn && conn.open) {
          conn.send({
            type: 'sync',
            m: { x: players.monkey.x, y: players.monkey.y },
            c: { x: players.croc.x, y: players.croc.y },
            state: gameState
          });
        }
      } else if (!isHost && gameState === 'playing') {
        if (conn && conn.open) {
          conn.send({ type: 'input', keys });
        }
      }

      const midX = (players.monkey.x + players.croc.x) / 2;
      cameraX += (midX - canvas.width / 2 - cameraX) * 0.1;
      cameraX = Math.max(0, cameraX);

      render();
      requestAnimationFrame(step);
    }

    function drawRope() {
      const p1 = players.monkey;
      const p2 = players.croc;
      const midX = (p1.x + p2.x) / 2;
      const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      const sag = Math.max(0, (ROPE_REST_LEN - dist) * 0.4 + 18);
      const midY = (p1.y + p2.y) / 2 + sag;

      ctx.save();
      ctx.strokeStyle = '#cda250';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.quadraticCurveTo(midX, midY, p2.x, p2.y);
      ctx.stroke();

      ctx.strokeStyle = '#855b1a';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 6]);
      ctx.stroke();
      ctx.restore();
    }

    function drawMonkey(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(0, p.h/2 + 2, 16, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#8d5b4c';
      ctx.beginPath();
      ctx.arc(0, 0, 18, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#e0a96d';
      ctx.beginPath();
      ctx.ellipse(0, 2, 12, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#8d5b4c';
      ctx.beginPath();
      ctx.arc(-16, -6, 6, 0, Math.PI * 2);
      ctx.arc(16, -6, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(-4, 0, 2.5, 0, Math.PI*2);
      ctx.arc(4, 0, 2.5, 0, Math.PI*2);
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('Monyet', 0, -24);
      ctx.restore();
    }

    function drawCroc(p) {
      ctx.save();
      ctx.translate(p.x, p.y);

      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(0, p.h/2 + 2, 24, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#386641';
      ctx.beginPath();
      ctx.roundRect(-24, -12, 48, 24, 8);
      ctx.fill();

      ctx.fillStyle = '#6a994e';
      ctx.beginPath();
      ctx.roundRect(14, -8, 16, 16, 4);
      ctx.fill();

      ctx.fillStyle = '#285430';
      for (let i = -16; i <= 8; i += 8) {
        ctx.beginPath();
        ctx.moveTo(i, -12);
        ctx.lineTo(i + 4, -18);
        ctx.lineTo(i + 8, -12);
        ctx.fill();
      }

      ctx.fillStyle = '#e9d8a6';
      ctx.beginPath();
      ctx.arc(10, -10, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(10, -10, 1.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('Buaya', 0, -24);
      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#10281b');
      grad.addColorStop(1, '#08170e');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(-Math.round(cameraX), 0);

      for (const b of platforms) {
        ctx.fillStyle = '#40916c';
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, [8, 8, 0, 0]);
        ctx.fill();

        ctx.fillStyle = '#2d6a4f';
        ctx.fillRect(b.x, b.y + 10, b.w, b.h - 10);
      }

      ctx.fillStyle = '#ffb703';
      ctx.fillRect(GOAL_X, 300, 8, 120);
      ctx.beginPath();
      ctx.moveTo(GOAL_X + 8, 300);
      ctx.lineTo(GOAL_X + 54, 320);
      ctx.lineTo(GOAL_X + 8, 340);
      ctx.fillStyle = '#e63946';
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px system-ui';
      ctx.fillText('FINISH', GOAL_X - 10, 280);

      drawRope();
      drawMonkey(players.monkey);
      drawCroc(players.croc);

      ctx.restore();

      if (gameState === 'waiting') {
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('Tali Rimba: Monyet & Buaya', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '14px system-ui';
        ctx.fillStyle = '#a7c957';
        ctx.fillText('Salin link & kirim ke teman untuk main berdua!', canvas.width / 2, canvas.height / 2 + 15);
      } else if (gameState === 'win') {
        ctx.fillStyle = 'rgba(13, 40, 24, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffb703';
        ctx.font = 'bold 32px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('MENANG BERDUA! 🎉', canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '15px system-ui';
        ctx.fillStyle = '#e2f8e7';
        ctx.fillText('Kerjasama Monyet & Buaya berhasil!', canvas.width / 2, canvas.height / 2 + 25);
      }
    }

    requestAnimationFrame(step);
  </script>
</body>
</html>
